<!doctype html><html><head><style>
@font-face{font-family:B;src:url(BricolageGrotesque-Variable.woff2);font-weight:200 800}
@font-face{font-family:H;src:url(HankenGrotesk-Variable.woff2);font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0a0a0a;color:#ededed;font-family:H;position:relative;overflow:hidden}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;justify-content:space-between;align-items:center}
.mark{font-family:B;font-weight:700;font-size:30px;display:flex;align-items:center;gap:5px;letter-spacing:-.02em}
.mark i{display:block;width:10px;height:26px;background:#a3e635}
.name{margin-top:54px;font-family:B;font-size:30px;color:#a1a1aa;font-weight:500}
h1{margin-top:14px;font-family:B;font-weight:650;font-size:76px;line-height:.98;letter-spacing:-.035em}
.sub{margin-top:30px;font-size:24px;color:#a1a1aa}
.card{width:300px;border:1px solid #262626;background:#141414;border-radius:18px;overflow:hidden;transform:rotate(-2deg);box-shadow:0 30px 80px -30px #000}
.slot{margin:16px auto 0;width:54px;height:8px;border-radius:9px;border:1px solid #262626;background:#0a0a0a}
.card img{display:block;width:150px;height:164px;object-fit:cover;border-radius:10px;border:1px solid #262626;margin:22px auto 0}
.card p{text-align:center;font-family:B;font-weight:600;font-size:22px;margin:16px 0 4px}
.card small{display:block;text-align:center;color:#a1a1aa;font-size:15px;margin-bottom:22px}
.band{height:7px;background:#a3e635}
</style></head><body><div class="wrap">
<div><div class="mark">EC<i></i></div>
<div class="name">Emmanuel Cabuloy</div>
<h1>Educator.<br>Developer.<br>Technology Enthusiast.</h1>
<p class="sub">ICT Educator and Software Developer, Davao City</p></div>
<div class="card"><div class="slot"></div><img src="profile.png"><p>Emmanuel Cabuloy</p><small>Licensed Professional Teacher</small><div class="band"></div></div>
</div></body></html>
